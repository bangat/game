<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>똥피하기 대전</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #fff7e8;
            --panel: #ffffff;
            --ink: #362d2a;
            --muted: #7b6d67;
            --line: #ead4b4;
            --brown: #8d5a35;
            --brown-dark: #5b3824;
            --mint: #35b8a6;
            --yellow: #ffd166;
            --danger: #dc4660;
            --shadow: #e6c99d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            width: 100%;
            max-width: 520px;
            height: var(--app-height, 100dvh);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at top left, rgba(141, 90, 53, 0.16), transparent 34%),
                linear-gradient(180deg, #fffaf0 0%, #fff0d1 100%);
            overflow: hidden;
            position: relative;
        }

        .topbar {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 46px 1fr 86px;
            gap: 8px;
            align-items: center;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
            border-bottom: 3px solid var(--line);
            background: rgba(255, 250, 235, 0.96);
        }

        .icon-btn,
        .action-btn,
        .control-btn {
            border: 3px solid var(--ink);
            background: var(--panel);
            color: var(--ink);
            font-weight: 900;
            box-shadow: 3px 3px 0 var(--shadow);
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1.5rem;
        }

        .title-box {
            min-width: 0;
            text-align: center;
        }

        .title-box h1 {
            font-size: 1.1rem;
            line-height: 1.1;
        }

        .title-box p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .alive-badge {
            min-height: 42px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background: var(--yellow);
            box-shadow: 3px 3px 0 #d6a944;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .alive-badge strong {
            line-height: 1;
            font-size: 1.08rem;
        }

        .alive-badge span {
            font-size: 0.66rem;
        }

        .content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 9px;
            padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        }

        .panel,
        .players-card,
        .arena-card,
        .result-card {
            border: 3px solid var(--ink);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .panel {
            flex-shrink: 0;
            padding: 12px;
        }

        .panel-title {
            font-size: 0.92rem;
            font-weight: 900;
            color: var(--brown-dark);
            text-align: center;
        }

        .panel-main {
            margin-top: 6px;
            font-size: 1.22rem;
            line-height: 1.25;
            font-weight: 900;
            text-align: center;
            word-break: keep-all;
        }

        .panel-sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
            line-height: 1.35;
            text-align: center;
        }

        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            min-height: 44px;
            border-radius: 13px;
            font-size: 0.95rem;
        }

        .action-btn.primary {
            background: var(--mint);
            color: #fff;
            border-color: var(--mint);
        }

        .players-card {
            flex-shrink: 0;
            padding: 8px;
        }

        .players-row {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
        }

        .player-chip {
            flex: 0 0 76px;
            min-height: 66px;
            border: 2px solid var(--line);
            border-radius: 12px;
            background: #fffaf0;
            display: grid;
            grid-template-columns: 30px 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px 5px;
            align-items: center;
            padding: 5px;
            font-weight: 900;
        }

        .player-chip.me {
            border-color: var(--mint);
            background: #e9fff9;
        }

        .player-chip.dead {
            opacity: 0.58;
            filter: grayscale(0.35);
        }

        .avatar {
            grid-row: 1 / span 2;
            width: 30px;
            height: 30px;
            border: 2px solid var(--ink);
            border-radius: 9px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 1.3rem;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-name,
        .player-stat {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-name {
            font-size: 0.68rem;
        }

        .player-stat {
            color: var(--brown);
            font-size: 0.66rem;
        }

        .arena-card {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 8px;
            overflow: hidden;
        }

        .arena-head {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
            font-weight: 900;
        }

        .arena-head strong {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.88rem;
        }

        .timer {
            flex-shrink: 0;
            min-width: 74px;
            border: 2px solid var(--line);
            border-radius: 999px;
            padding: 6px 8px;
            background: #fff8e7;
            color: var(--brown-dark);
            text-align: center;
            font-size: 0.78rem;
        }

        .arena {
            position: relative;
            flex: 1;
            min-height: 280px;
            border: 3px solid var(--ink);
            border-radius: 16px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 238, 204, 0.92) 100%),
                repeating-linear-gradient(90deg, rgba(141, 90, 53, 0.08) 0 2px, transparent 2px 54px);
            touch-action: none;
        }

        #poop-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .arena-player {
            position: absolute;
            left: 50%;
            bottom: 7%;
            width: 42px;
            height: 42px;
            transform: translateX(-50%);
            border: 3px solid var(--ink);
            border-radius: 12px;
            background: #fff;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            z-index: 2;
            font-size: 1.7rem;
        }

        .arena-player img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 9px;
        }

        .arena-player.me {
            border-color: var(--mint);
            box-shadow: 0 0 0 4px rgba(53, 184, 166, 0.22), 3px 3px 0 rgba(0, 0, 0, 0.15);
        }

        .arena-player.dead {
            opacity: 0.45;
            filter: grayscale(0.7);
        }

        .arena-player .name-tag {
            position: absolute;
            left: 50%;
            bottom: -20px;
            transform: translateX(-50%);
            max-width: 62px;
            padding: 2px 5px;
            border-radius: 999px;
            background: rgba(54, 45, 42, 0.8);
            color: #fff;
            font-size: 0.55rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-row {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .control-btn {
            min-height: 52px;
            border-radius: 14px;
            background: #fff8e7;
            font-size: 1.25rem;
        }

        .control-btn:active,
        .icon-btn:active,
        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        .result-card {
            display: none;
        }

        .result-card.active {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
            border: 0;
            border-radius: 0;
            background: rgba(48, 40, 36, 0.54);
            box-shadow: none;
        }

        .result-modal {
            width: min(100%, 440px);
            max-height: 86dvh;
            overflow-y: auto;
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: #fffdf7;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.18);
            padding: 14px;
        }

        .result-title {
            font-size: 1.18rem;
            font-weight: 900;
            color: var(--brown-dark);
            text-align: center;
        }

        .result-sub {
            margin: 6px 0 10px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
            text-align: center;
        }

        .rank-list {
            display: grid;
            gap: 7px;
        }

        .rank-row {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            gap: 7px;
            align-items: center;
            border: 2px solid var(--line);
            border-radius: 12px;
            background: #fff8e7;
            padding: 8px;
            font-size: 0.78rem;
            font-weight: 900;
        }

        .rank-row.winner {
            border-color: var(--yellow);
            background: #fff2c7;
        }

        .rank-row.me {
            border-color: var(--mint);
        }

        .rank-row span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(48, 40, 36, 0.4);
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            width: min(100%, 360px);
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: #fffdf7;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.18);
            padding: 18px;
            text-align: center;
        }

        .modal h2 {
            font-size: 1.18rem;
            font-weight: 900;
        }

        .modal p {
            margin-top: 8px;
            color: var(--muted);
            font-weight: 800;
            line-height: 1.45;
        }

        @media (max-height: 720px) {
            .content { gap: 7px; padding-top: 7px; }
            .panel { padding: 10px; }
            .arena { min-height: 230px; }
            .control-btn { min-height: 46px; }
        }
    </style>
</head>
<body>
    <main id="app">
        <header class="topbar">
            <button id="back-btn" class="icon-btn" type="button" aria-label="나가기">‹</button>
            <div class="title-box">
                <h1>똥피하기 대전</h1>
                <p id="room-name">게임방에 입장 중</p>
            </div>
            <div class="alive-badge">
                <strong id="alive-count">0</strong>
                <span>생존</span>
            </div>
        </header>

        <section class="content">
            <div id="setup-panel" class="panel">
                <div class="panel-title">마지막까지 살아남기</div>
                <div class="panel-main">위에서 떨어지는 똥을 피하세요</div>
                <div id="setup-sub" class="panel-sub">방장이 시작하면 모두 같은 판에서 동시에 움직입니다.</div>
                <div class="action-row">
                    <button id="start-btn" class="action-btn primary" type="button">시작</button>
                    <button id="room-btn-setup" class="action-btn" type="button">게임방</button>
                </div>
            </div>

            <div class="players-card">
                <div id="players-row" class="players-row"></div>
            </div>

            <div class="arena-card">
                <div class="arena-head">
                    <strong id="arena-title">대기 중</strong>
                    <div id="timer" class="timer">준비</div>
                </div>
                <div id="arena" class="arena">
                    <canvas id="poop-canvas"></canvas>
                    <div id="arena-players"></div>
                </div>
                <div class="control-row">
                    <button id="left-btn" class="control-btn" type="button">←</button>
                    <button id="right-btn" class="control-btn" type="button">→</button>
                </div>
            </div>

            <div id="result-card" class="result-card"></div>
        </section>

        <div id="loading-overlay" class="overlay active">
            <div class="modal">
                <h2 id="loading-title">똥비 준비중</h2>
                <p id="loading-text">방 정보를 확인하고 있습니다.</p>
            </div>
        </div>
    </main>

    <audio id="start-sound" src="./봄버맨사운드/321go.mp3" preload="auto"></audio>
    <audio id="hit-sound" src="./봄버맨사운드/물풍선터지는소리.mp3" preload="auto"></audio>
    <audio id="win-sound" src="./sound/게임승리.mp3" preload="auto"></audio>
    <audio id="lose-sound" src="./sound/게임패배.mp3" preload="auto"></audio>
    <audio id="bgm" src="./봄버맨사운드/배경음악1.mp3" preload="auto" loop></audio>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCmNAKmgF_L3o0QyOGh_oFAq_rMRtUyklw",
            authDomain: "goodluck-7c14b.firebaseapp.com",
            databaseURL: "https://goodluck-7c14b-default-rtdb.firebaseio.com",
            projectId: "goodluck-7c14b",
            storageBucket: "goodluck-7c14b.appspot.com",
            messagingSenderId: "858281658455",
            appId: "1:858281658455:web:9131280a459be983933b12"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const roomsRef = db.ref('rooms');

        const ROUND_LIMIT_MS = 65000;
        const PLAYER_Y = 0.86;
        const PLAYER_SIZE = 0.086;
        const POOP_SIZE = 0.064;
        const SPAWN_INTERVAL_MS = 430;
        const FALL_WINDOW_MS = 4200;
        const POSITION_WRITE_MS = 90;

        const app = document.getElementById('app');
        const backBtn = document.getElementById('back-btn');
        const roomNameEl = document.getElementById('room-name');
        const aliveCountEl = document.getElementById('alive-count');
        const setupPanelEl = document.getElementById('setup-panel');
        const setupSubEl = document.getElementById('setup-sub');
        const startBtn = document.getElementById('start-btn');
        const roomBtnSetup = document.getElementById('room-btn-setup');
        const playersRowEl = document.getElementById('players-row');
        const arenaTitleEl = document.getElementById('arena-title');
        const timerEl = document.getElementById('timer');
        const arenaEl = document.getElementById('arena');
        const canvas = document.getElementById('poop-canvas');
        const ctx = canvas.getContext('2d');
        const arenaPlayersEl = document.getElementById('arena-players');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const resultCardEl = document.getElementById('result-card');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingTitleEl = document.getElementById('loading-title');
        const loadingTextEl = document.getElementById('loading-text');

        let currentUser = null;
        let myPlayerId = null;
        let myNickname = '';
        let myAvatar = '';
        let roomId = null;
        let roomRef = null;
        let currentRoomData = null;
        let isHost = false;
        let isLeaving = false;
        let playerRestorePromise = null;
        let animationHandle = null;
        let lastFrameAt = 0;
        let lastPositionWriteAt = 0;
        let localX = 0.5;
        let moveDir = 0;
        let dragTargetX = null;
        let lastStartedAt = 0;
        let lastResultAt = 0;
        let hitSent = false;

        function setScreenHeight() {
            const viewportHeight = Math.floor(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight);
            document.documentElement.style.setProperty('--app-height', `${viewportHeight}px`);
            app.style.height = `${viewportHeight}px`;
            resizeCanvas();
        }

        function resizeCanvas() {
            const rect = arenaEl.getBoundingClientRect();
            const ratio = window.devicePixelRatio || 1;
            const width = Math.max(1, Math.floor(rect.width));
            const height = Math.max(1, Math.floor(rect.height));
            canvas.width = Math.floor(width * ratio);
            canvas.height = Math.floor(height * ratio);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        setScreenHeight();
        window.addEventListener('resize', setScreenHeight);
        window.visualViewport?.addEventListener('resize', setScreenHeight);
        window.visualViewport?.addEventListener('scroll', setScreenHeight);

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.replace('index.html');
                return;
            }

            currentUser = user;
            myPlayerId = user.uid;
            myNickname = localStorage.getItem('userNickname') || '플레이어';
            myAvatar = localStorage.getItem('userAvatar') || '🙂';

            const params = new URLSearchParams(window.location.search);
            roomId = params.get('roomId');
            if (!roomId) {
                alert('잘못된 접근입니다.');
                window.location.replace('대기실.html');
                return;
            }

            joinRoom(roomId);
        });

        function joinRoom(id) {
            roomRef = roomsRef.child(id);
            roomRef.once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    alert('방을 찾을 수 없습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                currentRoomData = snapshot.val() || {};
                isHost = currentRoomData.hostId === myPlayerId;
                const hasMyPlayer = Boolean(currentRoomData.players?.[myPlayerId]);
                const canRestorePlayer = currentRoomData.status === 'playing' && currentRoomData.gameType === 'poopDodge';

                if (!hasMyPlayer && !canRestorePlayer) {
                    alert('방 참가 정보가 없습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                syncMyPlayer().then(() => {
                    listenToRoom();
                }).catch(error => {
                    console.error('똥피하기 참가 정보 복구 실패:', error);
                    alert('방 입장에 실패했습니다.');
                    window.location.replace('대기실.html');
                });
            }).catch(error => {
                console.error('똥피하기 입장 실패:', error);
                alert('방 입장에 실패했습니다.');
                window.location.replace('대기실.html');
            });
        }

        function getMyPlayerData() {
            return {
                nickname: myNickname,
                avatar: myAvatar,
                isHost
            };
        }

        function syncMyPlayer() {
            if (!roomRef || !myPlayerId) return Promise.resolve();
            if (playerRestorePromise) return playerRestorePromise;

            playerRestorePromise = roomRef.child(`players/${myPlayerId}`).update(getMyPlayerData())
                .then(() => roomRef.child(`players/${myPlayerId}`).onDisconnect().cancel())
                .finally(() => {
                    playerRestorePromise = null;
                });

            return playerRestorePromise;
        }

        function listenToRoom() {
            roomRef.on('value', snapshot => {
                if (isLeaving) return;

                if (!snapshot.exists()) {
                    alert('방이 사라졌습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                currentRoomData = snapshot.val() || {};
                isHost = currentRoomData.hostId === myPlayerId;

                if (currentRoomData.status !== 'playing') {
                    stopBgm();
                    window.location.replace(`게임방.html?roomId=${roomId}`);
                    return;
                }

                if (!currentRoomData.players || !currentRoomData.players[myPlayerId]) {
                    showLoading('재접속 중', '참가 정보를 다시 연결하고 있습니다.');
                    syncMyPlayer().catch(() => window.location.replace('대기실.html'));
                    return;
                }

                roomNameEl.textContent = currentRoomData.roomName || '가족 방';
                const gameData = currentRoomData.gameData;
                if (!gameData || gameData.gameId !== 'poopDodge') {
                    if (isHost) initializeGameData();
                    else showLoading('똥비 준비중', '방장이 게임판을 준비하고 있습니다.');
                    return;
                }

                loadingOverlay.classList.remove('active');
                renderGame(gameData);
            });
        }

        function initializeGameData() {
            const players = currentRoomData?.players || {};
            const activeIds = Object.keys(players).slice(0, 5);
            const playerSnapshots = {};
            const playerStates = {};
            activeIds.forEach((id, index) => {
                const player = players[id] || {};
                playerSnapshots[id] = {
                    nickname: player.nickname || '플레이어',
                    avatar: player.avatar || '🙂',
                    isHost: currentRoomData.hostId === id
                };
                playerStates[id] = {
                    x: getStartX(index, activeIds.length),
                    alive: true,
                    diedAt: null
                };
            });

            roomRef.child('gameData').set({
                gameId: 'poopDodge',
                phase: 'setup',
                activePlayers: activeIds,
                playerSnapshots,
                playerStates,
                seed: 0,
                startedAt: null,
                endedAt: null,
                winnerId: null,
                createdAt: Date.now()
            });
        }

        function renderGame(gameData) {
            const players = getGamePlayers(gameData);
            const activeIds = getActivePlayerIds(gameData, players);
            const states = gameData.playerStates || {};
            const aliveIds = activeIds.filter(id => states[id]?.alive !== false);
            const myState = states[myPlayerId] || {};

            const startedAt = Number(gameData.startedAt || 0);
            if (typeof myState.x === 'number' && (gameData.phase !== 'playing' || myState.alive === false || startedAt !== lastStartedAt)) {
                localX = clamp(myState.x, 0.05, 0.95);
            }
            aliveCountEl.textContent = aliveIds.length;
            setupPanelEl.style.display = gameData.phase === 'setup' ? 'block' : 'none';
            setupSubEl.textContent = isHost ? '시작을 누르면 똥비가 떨어집니다.' : '방장이 시작할 때까지 기다려주세요.';
            startBtn.style.display = isHost ? 'block' : 'none';
            startBtn.disabled = !isHost;
            arenaTitleEl.textContent = getArenaTitle(gameData, myState, aliveIds.length);

            renderPlayers(gameData, players, activeIds);
            renderArenaPlayers(gameData, players, activeIds);
            renderResult(gameData, players, activeIds);
            updateTimer(gameData);
            syncRoundSound(gameData);
            startAnimationLoop();
        }

        function getArenaTitle(gameData, myState, aliveCount) {
            if (gameData.phase === 'setup') return '시작 대기 중';
            if (gameData.phase === 'result') return '결과 발표';
            if (myState.alive === false) return '탈락했습니다';
            return `${aliveCount}명 생존 중`;
        }

        function renderPlayers(gameData, players, activeIds) {
            const states = gameData.playerStates || {};
            playersRowEl.innerHTML = '';
            activeIds.forEach(id => {
                const player = players[id] || {};
                const state = states[id] || {};
                const dead = state.alive === false;
                const chip = document.createElement('div');
                chip.className = `player-chip ${id === myPlayerId ? 'me' : ''} ${dead ? 'dead' : ''}`;
                chip.innerHTML = `
                    <div class="avatar">${getAvatarHTML(player.avatar)}</div>
                    <div class="player-name">${escapeHTML(player.nickname || '플레이어')}</div>
                    <div class="player-stat">${getPlayerStat(gameData, state)}</div>
                `;
                playersRowEl.appendChild(chip);
            });
        }

        function renderArenaPlayers(gameData, players, activeIds) {
            const states = gameData.playerStates || {};
            arenaPlayersEl.innerHTML = '';
            activeIds.forEach(id => {
                const state = states[id] || {};
                const player = players[id] || {};
                const item = document.createElement('div');
                item.className = `arena-player ${id === myPlayerId ? 'me' : ''} ${state.alive === false ? 'dead' : ''}`;
                item.style.left = `${clamp(Number(state.x ?? 0.5), 0.05, 0.95) * 100}%`;
                item.innerHTML = `${getAvatarHTML(player.avatar)}<div class="name-tag">${escapeHTML(player.nickname || '플레이어')}</div>`;
                arenaPlayersEl.appendChild(item);
            });
        }

        function renderResult(gameData, players, activeIds) {
            if (gameData.phase !== 'result') {
                resultCardEl.classList.remove('active');
                resultCardEl.innerHTML = '';
                return;
            }

            const ranking = getRanking(gameData, players, activeIds);
            resultCardEl.classList.add('active');
            resultCardEl.innerHTML = `
                <div class="result-modal">
                    <div class="result-title">최종 순위</div>
                    <div class="result-sub">마지막까지 살아남은 사람이 1등입니다.</div>
                    <div class="rank-list">
                        ${ranking.map((row, index) => `
                            <div class="rank-row ${row.id === myPlayerId ? 'me' : ''} ${index === 0 ? 'winner' : ''}">
                                <strong>${index + 1}등</strong>
                                <span>${escapeHTML(row.name)}</span>
                                <strong>${row.timeText}</strong>
                            </div>
                        `).join('')}
                    </div>
                    <div class="action-row">
                        ${isHost ? '<button id="again-btn" class="action-btn primary" type="button">다시하기</button>' : ''}
                        <button id="room-btn-result" class="action-btn" type="button">게임방</button>
                    </div>
                </div>
            `;
            document.getElementById('again-btn')?.addEventListener('click', resetToSetup);
            document.getElementById('room-btn-result')?.addEventListener('click', returnToGameRoom);
        }

        function startRound() {
            if (!isHost || !roomRef || !currentRoomData?.gameData) return;
            const gameData = currentRoomData.gameData;
            const players = getGamePlayers(gameData);
            const activeIds = getActivePlayerIds(gameData, players);
            const now = Date.now();
            const states = {};
            activeIds.forEach((id, index) => {
                states[id] = {
                    x: getStartX(index, activeIds.length),
                    alive: true,
                    diedAt: null
                };
            });

            roomRef.child('gameData').update({
                phase: 'playing',
                playerStates: states,
                seed: Math.floor(Math.random() * 1000000000),
                startedAt: now + 1200,
                endedAt: null,
                winnerId: null
            });
        }

        function resetToSetup() {
            if (!isHost || !roomRef || !currentRoomData?.gameData) return;
            const gameData = currentRoomData.gameData;
            const players = getGamePlayers(gameData);
            const activeIds = getActivePlayerIds(gameData, players);
            const states = {};
            activeIds.forEach((id, index) => {
                states[id] = {
                    x: getStartX(index, activeIds.length),
                    alive: true,
                    diedAt: null
                };
            });

            stopBgm();
            roomRef.child('gameData').update({
                phase: 'setup',
                playerStates: states,
                seed: 0,
                startedAt: null,
                endedAt: null,
                winnerId: null
            });
        }

        function startAnimationLoop() {
            if (animationHandle) return;
            lastFrameAt = performance.now();
            animationHandle = requestAnimationFrame(tick);
        }

        function tick(now) {
            const dt = Math.min(48, now - lastFrameAt);
            lastFrameAt = now;
            updateLocalMovement(dt, now);
            drawFrame();
            animationHandle = requestAnimationFrame(tick);
        }

        function updateLocalMovement(dt, now) {
            const gameData = currentRoomData?.gameData;
            if (!gameData || gameData.gameId !== 'poopDodge') return;
            const state = gameData.playerStates?.[myPlayerId] || {};
            if (gameData.phase !== 'playing' || state.alive === false) return;

            const speed = 0.00105 * dt;
            if (dragTargetX !== null) {
                const diff = dragTargetX - localX;
                localX += clamp(diff, -speed * 1.35, speed * 1.35);
                if (Math.abs(diff) < 0.006) dragTargetX = null;
            }
            if (moveDir !== 0) localX += moveDir * speed;
            localX = clamp(localX, 0.05, 0.95);

            if (now - lastPositionWriteAt > POSITION_WRITE_MS) {
                lastPositionWriteAt = now;
                roomRef?.child(`gameData/playerStates/${myPlayerId}/x`).set(Number(localX.toFixed(4))).catch(() => {});
            }

            if (isColliding(gameData, localX)) markDead();
            else checkTimeLimit(gameData);
        }

        function drawFrame() {
            resizeCanvas();
            const rect = arenaEl.getBoundingClientRect();
            const width = Math.max(1, rect.width);
            const height = Math.max(1, rect.height);
            ctx.clearRect(0, 0, width, height);

            const gameData = currentRoomData?.gameData;
            if (gameData?.gameId === 'poopDodge') updateTimer(gameData);
            if (!gameData || gameData.gameId !== 'poopDodge' || gameData.phase !== 'playing') {
                drawWaitingText(width, height, gameData?.phase === 'result' ? '결과를 확인하세요' : '시작을 기다리세요');
                return;
            }

            const elapsed = getElapsed(gameData);
            const countdown = Number(gameData.startedAt || 0) - Date.now();
            if (countdown > 0) {
                drawWaitingText(width, height, `${Math.ceil(countdown / 1000)}초 후 시작`);
                return;
            }

            const objects = getPoops(gameData, elapsed);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            objects.forEach(obj => {
                const size = Math.max(22, width * POOP_SIZE);
                ctx.font = `${size}px sans-serif`;
                ctx.save();
                ctx.translate(obj.x * width, obj.y * height);
                ctx.rotate(obj.spin);
                ctx.fillText('💩', 0, 0);
                ctx.restore();
            });

            if (elapsed > ROUND_LIMIT_MS) checkTimeLimit(gameData);
        }

        function drawWaitingText(width, height, text) {
            ctx.fillStyle = 'rgba(91, 56, 36, 0.14)';
            ctx.font = '900 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width / 2, height / 2);
        }

        function isColliding(gameData, x) {
            const elapsed = getElapsed(gameData);
            if (elapsed < 0) return false;
            return getPoops(gameData, elapsed).some(obj => {
                const dx = Math.abs(obj.x - x);
                const dy = Math.abs(obj.y - PLAYER_Y);
                return dx < (PLAYER_SIZE + POOP_SIZE) * 0.42 && dy < (PLAYER_SIZE + POOP_SIZE) * 0.46;
            });
        }

        function markDead() {
            if (hitSent || !roomRef || !myPlayerId) return;
            hitSent = true;
            const now = Date.now();
            playAudio('hit-sound', 0.8);

            roomRef.transaction(room => {
                if (!room || room.status !== 'playing' || room.gameType !== 'poopDodge') return;
                const gameData = room.gameData;
                if (!gameData || gameData.gameId !== 'poopDodge' || gameData.phase !== 'playing') return;
                const states = gameData.playerStates || {};
                const myState = states[myPlayerId];
                if (!myState || myState.alive === false) return;

                myState.alive = false;
                myState.diedAt = now;
                myState.x = Number(localX.toFixed(4));
                states[myPlayerId] = myState;
                gameData.playerStates = states;
                finishIfNeeded(gameData, now);
                room.gameData = gameData;
                return room;
            }).finally(() => {
                setTimeout(() => { hitSent = false; }, 500);
            });
        }

        function checkTimeLimit(gameData) {
            if (!roomRef || gameData.phase !== 'playing') return;
            const elapsed = getElapsed(gameData);
            if (elapsed < ROUND_LIMIT_MS) return;
            const now = Date.now();

            roomRef.transaction(room => {
                if (!room || room.status !== 'playing' || room.gameType !== 'poopDodge') return;
                const data = room.gameData;
                if (!data || data.gameId !== 'poopDodge' || data.phase !== 'playing') return;
                data.phase = 'result';
                data.endedAt = now;
                data.winnerId = pickWinnerId(data);
                room.gameData = data;
                return room;
            });
        }

        function finishIfNeeded(gameData, now) {
            const activeIds = getActivePlayerIds(gameData, getGamePlayers(gameData));
            const states = gameData.playerStates || {};
            const aliveIds = activeIds.filter(id => states[id]?.alive !== false);
            if (aliveIds.length <= 1) {
                gameData.phase = 'result';
                gameData.endedAt = now;
                gameData.winnerId = aliveIds[0] || pickWinnerId(gameData);
            }
        }

        function getPoops(gameData, elapsed) {
            const seed = Number(gameData.seed || 1);
            const startIndex = Math.max(0, Math.floor((elapsed - FALL_WINDOW_MS) / SPAWN_INTERVAL_MS));
            const endIndex = Math.floor(elapsed / SPAWN_INTERVAL_MS) + 2;
            const speed = 0.00025 + Math.min(0.00022, elapsed * 0.0000000045);
            const result = [];
            for (let index = startIndex; index <= endIndex; index++) {
                const age = elapsed - index * SPAWN_INTERVAL_MS;
                if (age < 0) continue;
                const x = 0.06 + rand(seed, index, 1) * 0.88;
                const y = age * speed - 0.08;
                if (y < -0.12 || y > 1.12) continue;
                result.push({
                    x,
                    y,
                    spin: (rand(seed, index, 2) - 0.5) * 0.7
                });
            }
            return result;
        }

        function rand(seed, index, salt) {
            const value = Math.sin(seed * 0.0001 + index * 12.9898 + salt * 78.233) * 43758.5453;
            return value - Math.floor(value);
        }

        function getElapsed(gameData) {
            return Date.now() - Number(gameData.startedAt || Date.now());
        }

        function getActivePlayerIds(gameData, players) {
            if (Array.isArray(gameData.activePlayers)) {
                return [...new Set(gameData.activePlayers.filter(Boolean))].slice(0, 5);
            }
            return Object.keys(gameData.playerSnapshots || players || {}).filter(id => players?.[id]).slice(0, 5);
        }

        function getGamePlayers(gameData, room = currentRoomData) {
            return {
                ...(gameData?.playerSnapshots || {}),
                ...(room?.players || {})
            };
        }

        function getPlayerStat(gameData, state) {
            if (gameData.phase === 'setup') return '대기';
            if (state?.alive === false) return '탈락';
            if (gameData.phase === 'result') return '생존';
            return '생존중';
        }

        function getRanking(gameData, players, activeIds) {
            const startedAt = Number(gameData.startedAt || gameData.createdAt || Date.now());
            const endedAt = Number(gameData.endedAt || Date.now());
            const states = gameData.playerStates || {};
            return activeIds.map(id => {
                const state = states[id] || {};
                const alive = state.alive !== false;
                const survivedMs = (alive ? endedAt : Number(state.diedAt || endedAt)) - startedAt;
                return {
                    id,
                    name: players[id]?.nickname || '플레이어',
                    alive,
                    survivedMs: Math.max(0, survivedMs),
                    timeText: alive ? `${formatTime(survivedMs)} 생존` : `${formatTime(survivedMs)}`
                };
            }).sort((a, b) => {
                if (a.id === gameData.winnerId && b.id !== gameData.winnerId) return -1;
                if (b.id === gameData.winnerId && a.id !== gameData.winnerId) return 1;
                if (a.alive !== b.alive) return a.alive ? -1 : 1;
                if (a.survivedMs !== b.survivedMs) return b.survivedMs - a.survivedMs;
                return activeIds.indexOf(a.id) - activeIds.indexOf(b.id);
            });
        }

        function pickWinnerId(gameData) {
            const players = getGamePlayers(gameData);
            const activeIds = getActivePlayerIds(gameData, players);
            const ranking = getRanking(gameData, players, activeIds);
            return ranking[0]?.id || null;
        }

        function getStartX(index, total) {
            if (total <= 1) return 0.5;
            return 0.16 + (0.68 * index) / (total - 1);
        }

        function updateTimer(gameData) {
            if (gameData.phase === 'setup') {
                timerEl.textContent = '준비';
                return;
            }
            if (gameData.phase === 'result') {
                timerEl.textContent = formatTime(Number(gameData.endedAt || Date.now()) - Number(gameData.startedAt || Date.now()));
                return;
            }

            const countdown = Number(gameData.startedAt || 0) - Date.now();
            if (countdown > 0) {
                timerEl.textContent = `${Math.ceil(countdown / 1000)}초`;
                return;
            }
            timerEl.textContent = formatTime(getElapsed(gameData));
        }

        function formatTime(ms) {
            const value = Math.max(0, Number(ms || 0)) / 1000;
            return `${value.toFixed(1)}초`;
        }

        function returnToGameRoom() {
            isLeaving = true;
            stopBgm();
            if (!roomRef) {
                window.location.replace('대기실.html');
                return;
            }

            const done = () => window.location.replace(`게임방.html?roomId=${roomId}`);
            roomRef.update({
                status: 'lobby',
                gameData: null,
                gameStarted: false,
                readyPlayers: null,
                rematchRequests: null
            }).finally(done);
        }

        function setDirection(direction) {
            moveDir = direction;
            dragTargetX = null;
        }

        function stopDirection(direction) {
            if (moveDir === direction) moveDir = 0;
        }

        function setTargetFromPointer(event) {
            const rect = arenaEl.getBoundingClientRect();
            const clientX = event.touches?.[0]?.clientX ?? event.clientX;
            if (typeof clientX !== 'number') return;
            dragTargetX = clamp((clientX - rect.left) / Math.max(1, rect.width), 0.05, 0.95);
        }

        function showLoading(title, text) {
            loadingTitleEl.textContent = title;
            loadingTextEl.textContent = text;
            loadingOverlay.classList.add('active');
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function getAvatarHTML(avatar) {
            const value = String(avatar || '🙂');
            if (value.startsWith('http') || value.startsWith('./') || value.startsWith('/') || value.includes('.png') || value.includes('.jpg') || value.includes('.webp')) {
                return `<img src="${escapeHTML(value)}" alt="">`;
            }
            return escapeHTML(value);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, Number(value) || 0));
        }

        function syncRoundSound(gameData) {
            const startedAt = Number(gameData.startedAt || 0);
            const endedAt = Number(gameData.endedAt || 0);
            const myState = gameData.playerStates?.[myPlayerId] || {};

            if (gameData.phase === 'playing') {
                if (startedAt && startedAt !== lastStartedAt) {
                    lastStartedAt = startedAt;
                    lastResultAt = 0;
                    hitSent = false;
                    playAudio('start-sound', 0.58);
                }
                playBgm();
                return;
            }

            if (gameData.phase === 'result') {
                stopBgm();
                if (endedAt && endedAt !== lastResultAt) {
                    lastResultAt = endedAt;
                    playAudio(gameData.winnerId === myPlayerId || myState.alive !== false ? 'win-sound' : 'lose-sound', 0.85);
                }
                return;
            }

            stopBgm();
        }

        function playAudio(id, volume = 0.8) {
            const audio = document.getElementById(id);
            if (!audio) return;
            audio.volume = volume;
            try { audio.currentTime = 0; } catch (error) {}
            audio.play().catch(() => {});
        }

        function playBgm() {
            const audio = document.getElementById('bgm');
            if (!audio) return;
            audio.volume = 0.22;
            audio.play().catch(() => {});
        }

        function stopBgm() {
            const audio = document.getElementById('bgm');
            if (!audio) return;
            audio.pause();
            try { audio.currentTime = 0; } catch (error) {}
        }

        function unlockSound() {
            document.querySelectorAll('audio').forEach(audio => audio.load());
        }

        startBtn.addEventListener('click', startRound);
        roomBtnSetup.addEventListener('click', returnToGameRoom);
        backBtn.addEventListener('click', returnToGameRoom);

        leftBtn.addEventListener('pointerdown', event => { event.preventDefault(); setDirection(-1); });
        rightBtn.addEventListener('pointerdown', event => { event.preventDefault(); setDirection(1); });
        leftBtn.addEventListener('pointerup', () => stopDirection(-1));
        rightBtn.addEventListener('pointerup', () => stopDirection(1));
        leftBtn.addEventListener('pointercancel', () => stopDirection(-1));
        rightBtn.addEventListener('pointercancel', () => stopDirection(1));
        window.addEventListener('pointerup', () => { moveDir = 0; });

        arenaEl.addEventListener('pointerdown', event => {
            event.preventDefault();
            setTargetFromPointer(event);
        });
        arenaEl.addEventListener('pointermove', event => {
            if (event.buttons) setTargetFromPointer(event);
        });
        arenaEl.addEventListener('touchmove', event => {
            event.preventDefault();
            setTargetFromPointer(event);
        }, { passive: false });

        window.addEventListener('pointerdown', unlockSound, { once: true });
    </script>
</body>
</html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>html,body,#gallery{margin:0;width:100%;height:100%;overflow:hidden;background:#171b1c}canvas{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%}header{position:fixed;z-index:10;left:0;right:0;top:18px;text-align:center;color:#effff5;font:800 34px system-ui,sans-serif;letter-spacing:-1px;text-shadow:0 3px 12px #000}header small{display:block;margin-top:5px;color:#9db2a5;font-size:15px;font-weight:600;letter-spacing:2px}</style></head>
<body><header>이슬숲 탐험대 · 곤충 생태 도감<small>ORIGINAL PROCEDURAL 3D CREATURE COLLECTION · 20 SPECIES</small></header><canvas id="gallery"></canvas>
<script src="../../sky_tower/vendor/babylon-9.27.1.js"></script><script src="../shared/data.js"></script><script src="../world.js"></script>
<script>
  const B = BABYLON, canvas = document.getElementById('gallery'), engine = new B.Engine(canvas, true), scene = new B.Scene(engine);
  scene.clearColor = B.Color4.FromHexString('#171b1cff'); scene.imageProcessingConfiguration.contrast=1.12;scene.imageProcessingConfiguration.exposure=.94;
  const camera = new B.FreeCamera('gallery-camera', new B.Vector3(0, 23, 28), scene); camera.setTarget(new B.Vector3(0, .35, 0)); camera.fov=.65;
  new B.HemisphericLight('fill', new B.Vector3(-.4, 1, .2), scene).intensity = 1.05;
  const rim = new B.DirectionalLight('rim', new B.Vector3(.5, -1, -.3), scene); rim.position.set(-15, 22, 18); rim.intensity = .72;const shadows=new B.ShadowGenerator(1024,rim);shadows.useBlurExponentialShadowMap=true;shadows.blurKernel=12;
  const floorMat = new B.StandardMaterial('floorMat', scene); floorMat.diffuseColor = B.Color3.FromHexString('#252b2a'); floorMat.specularColor = B.Color3.FromHexString('#333b39');
  const floor = B.MeshBuilder.CreateGround('floor', {width: 38, height: 36}, scene); floor.material = floorMat;floor.receiveShadows=true;
  function cardLabel(text, x, z) {
    const plane = B.MeshBuilder.CreatePlane('card-label', {width: 4.7, height: .7}, scene); plane.position.set(x, .48, z + 1.72); plane.billboardMode=B.Mesh.BILLBOARDMODE_ALL;
    const texture = new B.DynamicTexture('card-texture', {width: 512, height: 90}, scene, false); texture.hasAlpha = true; texture.drawText(text, null, 61, 'bold 32px sans-serif', '#f3fff8', '#173128', true);
    const mat = new B.StandardMaterial('card-label-material', scene); mat.diffuseTexture = texture; mat.opacityTexture = texture; mat.emissiveColor = B.Color3.White(); mat.disableLighting = true; mat.backFaceCulling = false; plane.material = mat;
  }
  InsectData.species.forEach((species, index) => {
    const col = index % 5, row = Math.floor(index / 5), x = (col - 2) * 6.1, z = (1.5 - row) * 6.25;
    const padMat = new B.StandardMaterial('pad-' + index, scene); padMat.diffuseColor = B.Color3.FromHexString(index % 2 ? '#303836' : '#37413e'); padMat.specularColor = B.Color3.FromHexString('#4c5753');
    const pad = B.MeshBuilder.CreateCylinder('display-pad', {height:.3, diameter:4.5, tessellation:32}, scene); pad.position.set(x,.15,z); pad.material = padMat;
    const model = InsectWorld.createCreatureModel(scene, species.id, 'gallery-' + species.id); model.position.set(x,.42,z); model.scaling.setAll(species.id === 'pond_skater' || species.animationSet === 'butterfly' ? 1.4 : 1.58); model.rotation.y = -.18;model.getChildMeshes().forEach(mesh=>shadows.addShadowCaster(mesh));
    cardLabel(String(index + 1).padStart(2,'0') + '  ' + species.name, x, z);
  });
  engine.runRenderLoop(() => scene.render()); window.galleryReady = true;
</script></body></html>

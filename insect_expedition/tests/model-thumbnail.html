<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#dff4d5}canvas{display:block}</style></head><body><canvas id="preview"></canvas>
<script src="../../sky_tower/vendor/babylon-9.27.1.js"></script><script src="../shared/data.js"></script><script src="../characters.js"></script><script src="../world.js"></script><script>
  const B=BABYLON, params=new URLSearchParams(location.search), kind=params.get('kind')||'creature', id=params.get('id')||'dew_ladybird', canvas=document.getElementById('preview');
  const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true}),scene=new B.Scene(engine);scene.clearColor=B.Color4.FromHexString('#dff4d5ff');
  const camera=new B.FreeCamera('camera',kind==='character'?new B.Vector3(0,2.8,6.7):new B.Vector3(0,3.1,6.2),scene);camera.setTarget(new B.Vector3(0,kind==='character'?1.35:.48,0));camera.fov=.58;
  const key=new B.DirectionalLight('key',new B.Vector3(-.5,-1,-.45),scene);key.position.set(5,8,7);key.intensity=1.3;const fill=new B.HemisphericLight('fill',new B.Vector3(.3,1,.2),scene);fill.intensity=.78;
  const mat=new B.StandardMaterial('pad',scene);mat.diffuseColor=B.Color3.FromHexString('#5f9874');mat.specularColor=B.Color3.FromHexString('#9bd4ad');
  const pad=B.MeshBuilder.CreateCylinder('pad',{diameter:4.8,height:.34,tessellation:48},scene);pad.position.y=.02;pad.material=mat;
  const model=kind==='character'?InsectWorld.createAvatarModel(scene,id,''):InsectWorld.createCreatureModel(scene,id,'thumb-'+id);model.position.y=.23;
  if(kind==='creature'){const data=InsectData.speciesById[id];model.scaling.setAll(data&&data.scale>1.6?.86:1.65);}else model.scaling.setAll(1.18);
  engine.runRenderLoop(()=>scene.render());window.thumbnailReady=true;
</script></body></html>

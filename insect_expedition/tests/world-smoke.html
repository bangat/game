<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden}</style></head>
<body>
<canvas id="game"></canvas>
<script src="../../sky_tower/vendor/babylon-9.27.1.js"></script>
<script src="../shared/data.js"></script>
<script src="../characters.js"></script>
<script src="../world.js"></script>
<script>
  window.smoke = { hits: 0, selections: [], moves: [] };
  window.smoke.world = InsectWorld.create({
    canvas: document.getElementById('game'),
    characterId: 'scout',
    onMove: function (intent) { smoke.moves.push(intent); },
    onSelect: function (target) { smoke.selections.push(target); },
    onBattleHit: function () { smoke.hits += 1; }
  });
  smoke.world.setState({
    you: 'me',
    players: [{ uid: 'me', nickname: '솔잎 정찰가', x: 2, z: 4, character: 'scout', busy: false }, { uid: 'friend', nickname: '숲친구', x: 8, z: 5, character: 'river', busy: false }],
    spawns: [{ id: 'bug-1', speciesId: 'dew_ladybird', x: -5, z: 8, available: true, level: 1 }]
  });
</script>
</body>
</html>

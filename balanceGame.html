<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>벨런스게임</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #fff7e8;
            --panel: #ffffff;
            --ink: #362d2a;
            --muted: #7b6d67;
            --line: #ead4b4;
            --primary: #7c5cff;
            --primary-dark: #5135c9;
            --mint: #35b8a6;
            --yellow: #ffd166;
            --shadow: #e6c99d;
            --danger: #dc4660;
            --a-color: #ff6b57;
            --b-color: #35b8a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            width: 100%;
            max-width: 520px;
            height: var(--app-height, 100dvh);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at top left, rgba(124, 92, 255, 0.18), transparent 34%),
                linear-gradient(180deg, #fffaf0 0%, #fff1d4 100%);
            overflow: hidden;
            position: relative;
        }

        .topbar {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 46px 1fr 86px;
            gap: 8px;
            align-items: center;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
            border-bottom: 3px solid var(--line);
            background: rgba(255, 250, 235, 0.96);
        }

        .icon-btn,
        .action-btn,
        .choice-btn {
            border: 3px solid var(--ink);
            background: var(--panel);
            color: var(--ink);
            font-weight: 900;
            box-shadow: 3px 3px 0 var(--shadow);
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1.5rem;
        }

        .title-box {
            min-width: 0;
            text-align: center;
        }

        .title-box h1 {
            font-size: 1.15rem;
            line-height: 1.1;
        }

        .title-box p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-badge {
            min-height: 42px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background: var(--yellow);
            box-shadow: 3px 3px 0 #d6a944;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .score-badge strong {
            line-height: 1;
            font-size: 1.08rem;
        }

        .score-badge span {
            font-size: 0.66rem;
        }

        .content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
        }

        .round-card,
        .question-card,
        .choices-card,
        .result-card,
        .score-card {
            border: 3px solid var(--ink);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .round-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 9px 10px;
        }

        .round-text {
            min-width: 0;
            font-size: 0.86rem;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-pill {
            min-width: 64px;
            padding: 7px 8px;
            border-radius: 999px;
            background: #fff1d1;
            border: 2px solid var(--line);
            color: var(--primary-dark);
            text-align: center;
            font-weight: 900;
        }

        .question-card {
            margin-top: 10px;
            padding: 18px 14px;
            text-align: center;
        }

        .question-card .eyebrow {
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: 900;
        }

        .question-card h2 {
            margin-top: 8px;
            font-size: clamp(1.35rem, 6.5vw, 1.95rem);
            line-height: 1.18;
            word-break: keep-all;
        }

        .status-text {
            margin-top: 10px;
            min-height: 22px;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 800;
        }

        .choices-card {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
        }

        .choice-btn {
            min-height: 104px;
            border-radius: 16px;
            padding: 12px;
            display: grid;
            grid-template-columns: 42px 1fr;
            gap: 10px;
            align-items: center;
            text-align: left;
            background: #fff;
        }

        .choice-btn:disabled {
            opacity: 0.86;
        }

        .choice-btn.selected {
            animation: popTap 0.22s ease;
        }

        .choice-btn.choice-a.selected,
        .choice-btn.choice-a.majority {
            border-color: var(--a-color);
            background: #fff0ec;
        }

        .choice-btn.choice-b.selected,
        .choice-btn.choice-b.majority {
            border-color: var(--b-color);
            background: #effffb;
        }

        .choice-mark {
            width: 42px;
            height: 42px;
            border: 3px solid var(--ink);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            background: #fff8e6;
        }

        .choice-text {
            min-width: 0;
            font-size: 1.08rem;
            line-height: 1.25;
            font-weight: 900;
            word-break: keep-all;
        }

        .choice-count {
            grid-column: 1 / -1;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 900;
            text-align: right;
        }

        .result-card,
        .score-card {
            margin-top: 10px;
            padding: 12px;
        }

        .result-title,
        .score-title {
            font-size: 0.95rem;
            font-weight: 900;
        }

        .result-main {
            margin-top: 8px;
            color: var(--primary-dark);
            font-size: 1.22rem;
            font-weight: 900;
            line-height: 1.25;
        }

        .result-sub {
            margin-top: 5px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 800;
        }

        .bar-list,
        .vote-list {
            display: grid;
            gap: 7px;
            margin-top: 10px;
        }

        .bar-row {
            display: grid;
            gap: 5px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 900;
        }

        .bar-track {
            height: 16px;
            border: 2px solid var(--line);
            border-radius: 999px;
            background: #fff8e8;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        .bar-fill.a { background: var(--a-color); }
        .bar-fill.b { background: var(--b-color); }

        .vote-row,
        .score-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            border-radius: 10px;
            background: #fff8e8;
            padding: 7px 8px;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .score-row.me {
            background: #ecfffb;
        }

        .score-row.winner {
            background: #fff1cf;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            min-height: 44px;
            border-radius: 13px;
            font-size: 0.95rem;
        }

        .action-btn.primary {
            background: var(--mint);
            color: #fff;
            border-color: var(--mint);
        }

        .action-btn.danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .result-card.pop,
        .score-card.pop,
        .question-card.pop {
            animation: popTap 0.32s ease;
        }

        @keyframes popTap {
            0% { transform: scale(0.96); }
            70% { transform: scale(1.025); }
            100% { transform: scale(1); }
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(54, 45, 42, 0.42);
            z-index: 20;
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            width: min(100%, 360px);
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 5px 5px 0 var(--shadow);
            padding: 18px;
            text-align: center;
        }

        .modal h2 {
            font-size: 1.25rem;
        }

        .modal p {
            margin-top: 8px;
            color: var(--muted);
            font-weight: 800;
            line-height: 1.45;
        }
    </style>
</head>

            <div id="result-card" class="result-card" style="display:none;"></div>
            <div id="score-card" class="score-card"></div>

            { id: 'b80', a: '친구들 앞에서 애교 부리기', b: '가족 앞에서 랩하기' },
            { id: 'b81', a: '하루 종일 말끝마다 뿡 붙이기', b: '하루 종일 말끝마다 냐옹 붙이기' },
            { id: 'b82', a: '사진마다 눈 감고 나오기', b: '사진마다 입 크게 벌리고 나오기' },
            { id: 'b83', a: '운동화 좌우 바꿔 신고 외출', b: '양말 짝짝이로 외출' },
            { id: 'b84', a: '친구 생일파티에서 춤추기', b: '가족 생일파티에서 성대모사하기' },
            { id: 'b85', a: '하루 종일 웃참하기', b: '하루 종일 울상으로 있기' }
        ];

        const app = document.getElementById('app');
        const backBtn = document.getElementById('back-btn');
        const roomNameEl = document.getElementById('room-name');
        const myScoreEl = document.getElementById('my-score');
        const roundTextEl = document.getElementById('round-text');
        const timerPillEl = document.getElementById('timer-pill');
        const questionTextEl = document.getElementById('question-text');
        const statusTextEl = document.getElementById('status-text');
        const choicesCardEl = document.getElementById('choices-card');
        const resultCardEl = document.getElementById('result-card');
        const scoreCardEl = document.getElementById('score-card');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingTitleEl = document.getElementById('loading-title');
        const loadingTextEl = document.getElementById('loading-text');

        let currentUser = null;
        let myPlayerId = null;
        let myNickname = '';
        let myAvatar = '';
        let roomId = null;
        let roomRef = null;
        let currentRoomData = null;
        let isHost = false;
        let isLeaving = false;
        let playerRestorePromise = null;
        let audioContext = null;
        let lastSoundKey = '';
        let lastSpokenKey = '';

        function setScreenHeight() {
            const viewportHeight = Math.floor(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight);
            document.documentElement.style.setProperty('--app-height', `${viewportHeight}px`);
            app.style.height = `${viewportHeight}px`;
        }

        setScreenHeight();
        window.addEventListener('resize', setScreenHeight);
        window.visualViewport?.addEventListener('resize', setScreenHeight);
        window.visualViewport?.addEventListener('scroll', setScreenHeight);

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.replace('index.html');
                return;
            }

            currentUser = user;
            myPlayerId = user.uid;
            myNickname = localStorage.getItem('userNickname') || '플레이어';
            myAvatar = localStorage.getItem('userAvatar') || '🙂';

            const params = new URLSearchParams(window.location.search);
            roomId = params.get('roomId');
            if (!roomId) {
                alert('잘못된 접근입니다.');
                window.location.replace('대기실.html');
                return;
            }

            joinRoom(roomId);
        });

        function joinRoom(id) {
            roomRef = roomsRef.child(id);
            roomRef.once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    alert('방을 찾을 수 없습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                currentRoomData = snapshot.val() || {};
                isHost = currentRoomData.hostId === myPlayerId;
                const hasMyPlayer = Boolean(currentRoomData.players?.[myPlayerId]);
                const canRestorePlayer = currentRoomData.status === 'playing' && currentRoomData.gameType === 'balanceGame';

                if (!hasMyPlayer && !canRestorePlayer) {
                    alert('방 참가 정보가 없습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                syncMyPlayer().then(() => {
                    listenToRoom();
                }).catch(error => {
                    console.error('벨런스게임 참가 정보 복구 실패:', error);
                    alert('방 입장에 실패했습니다.');
                    window.location.replace('대기실.html');
                });
            }).catch(error => {
                console.error('벨런스게임 입장 실패:', error);
                alert('방 입장에 실패했습니다.');
                window.location.replace('대기실.html');
            });
        }

        function getMyPlayerData() {
            return {
                nickname: myNickname,
                avatar: myAvatar,
                isHost
            };
        }

        function syncMyPlayer() {
            if (!roomRef || !myPlayerId) return Promise.resolve();
            if (playerRestorePromise) return playerRestorePromise;

            playerRestorePromise = roomRef.child(`players/${myPlayerId}`).update(getMyPlayerData())
                .then(() => roomRef.child(`players/${myPlayerId}`).onDisconnect().cancel())
                .finally(() => {
                    playerRestorePromise = null;
                });

            return playerRestorePromise;
        }

        function listenToRoom() {
            roomRef.on('value', snapshot => {
                if (isLeaving) return;

                if (!snapshot.exists()) {
                    alert('방이 사라졌습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                currentRoomData = snapshot.val() || {};
                isHost = currentRoomData.hostId === myPlayerId;
                const gameData = currentRoomData.gameData;

                if (currentRoomData.status !== 'playing') {
                    window.location.replace(`게임방.html?roomId=${roomId}`);
                    return;
                }

                if (!currentRoomData.players || !currentRoomData.players[myPlayerId]) {
                    showLoading('재접속 중', '참가 정보를 다시 연결하고 있습니다.');
                    syncMyPlayer().catch(error => {
                        console.error('벨런스게임 참가 정보 재연결 실패:', error);
                        alert('방에서 퇴장되었습니다.');
                        window.location.replace('대기실.html');
                    });
                    return;
                }

                roomNameEl.textContent = currentRoomData.roomName || '가족 방';

                if (!gameData || gameData.gameId !== 'balanceGame') {
                    if (isHost) {
                        initializeGame();
                    } else {
                        showLoading('문제 준비중', '방장이 문제를 준비하고 있습니다.');
                    }
                    return;
                }

                loadingOverlay.classList.remove('active');
                renderGame(gameData);
                if (isHost) finishVotingIfReady();
            });
        }

        function initializeGame() {
            if (!roomRef) return;

            const players = currentRoomData?.players || {};
            const playerIds = Object.keys(players).slice(0, 4);
            if (!playerIds.length) return;

            const prompt = pickPrompt([]);
            const scores = {};
            const playerStates = {};
            const playerSnapshots = {};
            playerIds.forEach(id => {
                const player = players[id] || {};
                scores[id] = 0;
                playerStates[id] = { score: 0, ready: true };
                playerSnapshots[id] = {
                    nickname: player.nickname || '플레이어',
                    avatar: player.avatar || '🙂',
                    isHost: currentRoomData?.hostId === id
                };
            });

            roomRef.child('gameData').set({
                gameId: 'balanceGame',
                phase: 'voting',
                round: 1,
                totalRounds: TOTAL_ROUNDS,
                activePlayers: playerIds,
                promptId: prompt.id,
                optionA: prompt.a,
                optionB: prompt.b,
                usedPromptIds: [prompt.id],
                votes: {},
                scores,
                players: playerStates,
                playerSnapshots,
                lastResult: null,
                roundStartedAt: Date.now(),
                roundEndsAt: Date.now() + ROUND_TIME_MS,
                createdAt: Date.now()
            }).catch(error => {
                console.error('벨런스게임 데이터 생성 실패:', error);
                showLoading('문제 생성 실패', '방장이 다시 시작을 시도해주세요.');
            });
        }

        function renderGame(gameData) {
            const players = getGamePlayers(gameData);
            const activeIds = getActivePlayerIds(gameData, players);
            const myScore = Number(gameData.scores?.[myPlayerId] || 0);
            myScoreEl.textContent = myScore;
            roundTextEl.textContent = gameData.phase === 'final'
                ? '최종 결과'
                : `${Number(gameData.round || 1)} / ${Number(gameData.totalRounds || TOTAL_ROUNDS)} 라운드`;
            questionTextEl.textContent = gameData.phase === 'final' ? '우리 가족 선택 결과!' : '어느 쪽을 고를까요?';

            renderTimer(gameData);
            renderChoices(gameData, activeIds);
            renderResult(gameData, players, activeIds);
            renderScores(gameData, players, activeIds);
            handleGameSound(gameData);
        }

        function renderTimer(gameData) {
            if (gameData.phase !== 'voting') {
                timerPillEl.textContent = gameData.phase === 'final' ? '끝' : '공개';
                return;
            }

            const remaining = Math.max(0, Math.ceil((Number(gameData.roundEndsAt || 0) - Date.now()) / 1000));
            timerPillEl.textContent = `${remaining}초`;
        }

        function renderChoices(gameData, activeIds) {
            choicesCardEl.innerHTML = '';
            const votes = gameData.votes || {};
            const myVote = votes[myPlayerId]?.choice || null;
            const result = gameData.lastResult || {};
            const majorityChoices = result.majorityChoices || [];
            const counts = result.counts || {};
            const votedCount = Object.keys(votes).filter(id => activeIds.includes(id)).length;

            [
                { key: 'A', text: gameData.optionA || '선택 A', count: counts.A || 0 },
                { key: 'B', text: gameData.optionB || '선택 B', count: counts.B || 0 }
            ].forEach(option => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `choice-btn choice-${option.key.toLowerCase()}`;
                if (myVote === option.key) button.classList.add('selected');
                if (majorityChoices.includes(option.key)) button.classList.add('majority');
                button.disabled = gameData.phase !== 'voting' || Boolean(myVote);
                button.innerHTML = `
                    <div class="choice-mark">${option.key}</div>
                    <div class="choice-text">${escapeHTML(option.text)}</div>
                    <div class="choice-count">${gameData.phase === 'voting' ? (myVote === option.key ? '내 선택' : '누르기') : `${option.count}명`}</div>
                `;
                button.addEventListener('click', () => submitChoice(option.key));
                choicesCardEl.appendChild(button);
            });

            if (gameData.phase === 'voting') {
                statusTextEl.textContent = myVote
                    ? `${myVote} 선택 완료`
                    : `현재 ${votedCount}/${activeIds.length}명 선택`;
            } else {
                statusTextEl.textContent = gameData.phase === 'final' ? '최종 점수를 확인하세요.' : '가족들의 선택 결과입니다.';
            }
        }

        function renderResult(gameData, players, activeIds) {
            if (gameData.phase === 'voting') {
                resultCardEl.style.display = 'none';
                resultCardEl.innerHTML = '';
                return;
            }

            resultCardEl.style.display = 'block';

            if (gameData.phase === 'final') {
                const ranking = getRanking(gameData, players, activeIds);
                const winnerNames = ranking.length ? ranking.filter(row => row.score === ranking[0].score).map(row => row.name).join(', ') : '없음';
                resultCardEl.innerHTML = `
                    <div class="result-title">최종 승리</div>
                    <div class="result-main">${escapeHTML(winnerNames)}</div>
                    <div class="result-sub">가족의 마음을 가장 잘 맞춘 사람입니다.</div>
                    <div class="actions">
                        ${isHost ? '<button id="restart-btn" class="action-btn primary" type="button">다시하기</button>' : ''}
                        <button id="room-btn" class="action-btn" type="button">게임방</button>
                    </div>
                `;
                popElement(resultCardEl);
                document.getElementById('restart-btn')?.addEventListener('click', initializeGame);
                document.getElementById('room-btn')?.addEventListener('click', returnToGameRoom);
                return;
            }

            const result = gameData.lastResult || {};
            const counts = result.counts || {};
            const total = Math.max(1, Number(counts.A || 0) + Number(counts.B || 0));
            const percentA = Math.round((Number(counts.A || 0) / total) * 100);
            const percentB = Math.round((Number(counts.B || 0) / total) * 100);
            const majorityChoices = result.majorityChoices || [];
            const majorityText = majorityChoices.length === 0
                ? '선택 없음'
                : (majorityChoices.length === 2 ? '동률' : (majorityChoices[0] === 'A' ? gameData.optionA : gameData.optionB));
            const voteRows = activeIds.map(id => {
                const vote = gameData.votes?.[id];
                const voter = players[id]?.nickname || '플레이어';
                const target = vote?.choice === 'A' ? gameData.optionA : (vote?.choice === 'B' ? gameData.optionB : '미선택');
                return `<div class="vote-row"><span>${escapeHTML(voter)}</span><strong>${escapeHTML(target)}</strong></div>`;
            }).join('');

            resultCardEl.innerHTML = `
                <div class="result-title">이번 라운드 결과</div>
                <div class="result-main">${escapeHTML(majorityText)}</div>
                <div class="result-sub">많이 고른 쪽을 맞히면 점수를 얻습니다.</div>
                <div class="bar-list">
                    <div class="bar-row">
                        <div class="bar-label"><span>A ${escapeHTML(gameData.optionA)}</span><strong>${counts.A || 0}명</strong></div>
                        <div class="bar-track"><div class="bar-fill a" style="width:${percentA}%"></div></div>
                    </div>
                    <div class="bar-row">
                        <div class="bar-label"><span>B ${escapeHTML(gameData.optionB)}</span><strong>${counts.B || 0}명</strong></div>
                        <div class="bar-track"><div class="bar-fill b" style="width:${percentB}%"></div></div>
                    </div>
                </div>
                <div class="vote-list">${voteRows}</div>
                ${isHost ? `<div class="actions"><button id="next-round-btn" class="action-btn primary" type="button">${Number(gameData.round || 1) >= Number(gameData.totalRounds || TOTAL_ROUNDS) ? '결과 보기' : '다음 문제'}</button></div>` : '<div class="result-sub">방장이 다음 문제로 넘깁니다.</div>'}
            `;
            popElement(resultCardEl);
            document.getElementById('next-round-btn')?.addEventListener('click', nextRound);
        }

        function renderScores(gameData, players, activeIds) {
            const ranking = getRanking(gameData, players, activeIds);
            scoreCardEl.innerHTML = `
                <div class="score-title">점수판</div>
                <div class="vote-list">
                    ${ranking.map((row, index) => `
                        <div class="score-row ${row.id === myPlayerId ? 'me' : ''} ${index === 0 ? 'winner' : ''}">
                            <span>${index + 1}. ${escapeHTML(row.name)}</span>
                            <strong>${row.score}점</strong>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function submitChoice(choice) {
            const gameData = currentRoomData?.gameData;
            if (!roomRef || !gameData || gameData.phase !== 'voting') return;
            if (!['A', 'B'].includes(choice)) return;
            if (gameData.votes?.[myPlayerId]) return;

            playPickSound();
            roomRef.child(`gameData/votes/${myPlayerId}`).set({
                choice,
                at: Date.now()
            });
        }

        function finishVotingIfReady(force = false) {
            if (!isHost || !roomRef || !currentRoomData?.gameData) return;

            roomRef.transaction(room => {
                if (!room || !room.gameData || room.gameData.gameId !== 'balanceGame') return;
                const gameData = room.gameData;
                if (gameData.phase !== 'voting') return;

                const activeIds = getActivePlayerIds(gameData, getGamePlayers(gameData, room));
                const votes = gameData.votes || {};
                const allVoted = activeIds.length > 0 && activeIds.every(id => votes[id]);
                const timeOver = Date.now() >= Number(gameData.roundEndsAt || 0);
                if (!force && !allVoted && !timeOver) return;

                return {
                    ...room,
                    gameData: buildRevealGameData(gameData, activeIds)
                };
            });
        }

        function buildRevealGameData(gameData, activeIds) {
            const votes = gameData.votes || {};
            const counts = { A: 0, B: 0 };

            activeIds.forEach(id => {
                const choice = votes[id]?.choice;
                if (choice === 'A' || choice === 'B') counts[choice] += 1;
            });

            const maxCount = Math.max(counts.A, counts.B);
            const majorityChoices = maxCount > 0 ? ['A', 'B'].filter(choice => counts[choice] === maxCount) : [];
            const isTie = majorityChoices.length === 2;
            const scores = { ...(gameData.scores || {}) };
            activeIds.forEach(id => { scores[id] = Number(scores[id] || 0); });

            const majorityVoters = activeIds.filter(id => majorityChoices.includes(votes[id]?.choice));
            majorityVoters.forEach(id => {
                scores[id] += isTie ? 1 : 2;
            });

            const fastestId = isTie ? null : majorityVoters.slice().sort((a, b) => Number(votes[a]?.at || 0) - Number(votes[b]?.at || 0))[0] || null;
            if (fastestId) scores[fastestId] += 1;

            return {
                ...gameData,
                phase: 'reveal',
                scores,
                lastResult: {
                    counts,
                    majorityChoices,
                    maxCount,
                    majorityVoters,
                    fastestId,
                    revealedAt: Date.now()
                }
            };
        }

        function nextRound() {
            if (!isHost || !roomRef) return;

            roomRef.transaction(room => {
                if (!room || !room.gameData || room.gameData.gameId !== 'balanceGame') return;
                const gameData = room.gameData;
                if (gameData.phase !== 'reveal') return;

                const round = Number(gameData.round || 1);
                const totalRounds = Number(gameData.totalRounds || TOTAL_ROUNDS);
                if (round >= totalRounds) {
                    return {
                        ...room,
                        gameData: {
                            ...gameData,
                            phase: 'final',
                            endedAt: Date.now()
                        }
                    };
                }

                const used = Array.isArray(gameData.usedPromptIds) ? gameData.usedPromptIds : [];
                const prompt = pickPrompt(used);
                return {
                    ...room,
                    gameData: {
                        ...gameData,
                        phase: 'voting',
                        round: round + 1,
                        promptId: prompt.id,
                        optionA: prompt.a,
                        optionB: prompt.b,
                        usedPromptIds: used.concat(prompt.id),
                        votes: {},
                        lastResult: null,
                        roundStartedAt: Date.now(),
                        roundEndsAt: Date.now() + ROUND_TIME_MS
                    }
                };
            });
        }

        function returnToGameRoom() {
            isLeaving = true;

            if (!roomRef) {
                window.location.replace('대기실.html');
                return;
            }

            const done = () => window.location.replace(`게임방.html?roomId=${roomId}`);
            roomRef.update({
                status: 'lobby',
                gameData: null,
                gameStarted: false,
                readyPlayers: null,
                rematchRequests: null
            }).finally(done);
        }

        function getActivePlayerIds(gameData, players) {
            if (Array.isArray(gameData.activePlayers)) {
                return [...new Set(gameData.activePlayers.filter(Boolean))].slice(0, 4);
            }
            return Object.keys(gameData.players || players || {}).filter(id => players?.[id]).slice(0, 4);
        }

        function getGamePlayers(gameData, room = currentRoomData) {
            return {
                ...(gameData?.playerSnapshots || {}),
                ...(room?.players || {})
            };
        }

        function getRanking(gameData, players, activeIds) {
            return activeIds.map(id => ({
                id,
                name: players[id]?.nickname || '플레이어',
                score: Number(gameData.scores?.[id] || 0)
            })).sort((a, b) => {
                if (a.score !== b.score) return b.score - a.score;
                return activeIds.indexOf(a.id) - activeIds.indexOf(b.id);
            });
        }

        function pickPrompt(usedIds) {
            const used = new Set(usedIds || []);
            const pool = PROMPT_BANK.filter(prompt => !used.has(prompt.id));
            const source = pool.length ? pool : PROMPT_BANK;
            return source[Math.floor(Math.random() * source.length)];
        }

        function showLoading(title, text) {
            loadingTitleEl.textContent = title;
            loadingTextEl.textContent = text;
            loadingOverlay.classList.add('active');
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function ensureAudio() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioContext = new AudioContextClass();
            }
            if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
            return audioContext;
        }

        function playTone(frequency, duration = 0.09, type = 'sine', volume = 0.05, delay = 0) {
            const context = ensureAudio();
            if (!context) return;
            const start = context.currentTime + delay;
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            oscillator.connect(gain);
            gain.connect(context.destination);
            oscillator.start(start);
            oscillator.stop(start + duration + 0.03);
        }

        function playAudio(id, volume = 0.9) {
            const audio = document.getElementById(id);
            if (!audio) return;
            audio.volume = volume;
            try { audio.currentTime = 0; } catch (error) {}
            audio.play().catch(() => {});
        }

        function playPickSound() {
            playAudio('pick-sound', 0.95);
            playTone(480, 0.08, 'triangle', 0.06);
            playTone(720, 0.1, 'triangle', 0.045, 0.05);
        }

        function playRevealSound() {
            playAudio('reveal-sound', 0.9);
            playTone(360, 0.08, 'square', 0.045);
            playTone(620, 0.12, 'triangle', 0.055, 0.07);
            playTone(830, 0.1, 'triangle', 0.045, 0.16);
        }

        function playNextSound() {
            playAudio('next-sound', 0.78);
            playTone(640, 0.07, 'sine', 0.04);
            playTone(860, 0.08, 'sine', 0.04, 0.05);
        }

        function playFinalSound() {
            playAudio('final-sound', 0.9);
            playTone(520, 0.1, 'triangle', 0.055);
            playTone(760, 0.13, 'triangle', 0.055, 0.08);
            playTone(1040, 0.18, 'triangle', 0.05, 0.18);
        }

        function handleGameSound(gameData) {
            const soundKey = `${gameData.phase}:${gameData.round}:${gameData.lastResult?.revealedAt || gameData.endedAt || gameData.promptId || ''}`;
            if (lastSoundKey === soundKey) return;
            lastSoundKey = soundKey;

            if (gameData.phase === 'voting') {
                speakPrompt(gameData);
                popElement(questionTextEl.closest('.question-card'));
            } else if (gameData.phase === 'reveal') {
                playRevealSound();
            } else if (gameData.phase === 'final') {
                playFinalSound();
                popElement(scoreCardEl);
            }
        }

        function popElement(element) {
            if (!element) return;
            element.classList.remove('pop');
            void element.offsetWidth;
            element.classList.add('pop');
        }

        function speakPrompt(gameData) {
            const key = `${gameData.round}:${gameData.promptId}`;
            if (lastSpokenKey === key) return;
            lastSpokenKey = key;
            speakText(`${gameData.optionA || '선택 A'} 대 ${gameData.optionB || '선택 B'}`);
        }

        function speakText(text) {
            if (!text || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.02;
                utterance.pitch = 1.08;
                window.speechSynthesis.speak(utterance);
            } catch (error) {}
        }

        function unlockSound() {
            ensureAudio();
            document.querySelectorAll('audio').forEach(audio => audio.load());
            const gameData = currentRoomData?.gameData;
            if (gameData?.gameId === 'balanceGame' && gameData.phase === 'voting') {
                lastSpokenKey = '';
                speakPrompt(gameData);
            }
        }

        setInterval(() => {
            const gameData = currentRoomData?.gameData;
            if (!gameData || gameData.gameId !== 'balanceGame') return;
            renderTimer(gameData);
            if (isHost && gameData.phase === 'voting') finishVotingIfReady();
        }, 500);

        backBtn.addEventListener('click', returnToGameRoom);
        window.addEventListener('pointerdown', unlockSound, { once: true });
    </script>
</body>
</html>

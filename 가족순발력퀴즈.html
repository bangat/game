<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>가족순발력퀴즈</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #fff7e8;
            --panel: #ffffff;
            --ink: #362d2a;
            --muted: #7b6d67;
            --line: #ead4b4;
            --primary: #ff6b57;
            --primary-dark: #b94335;
            --mint: #35b8a6;
            --yellow: #ffd166;
            --shadow: #e6c99d;
            --danger: #dc4660;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            width: 100%;
            max-width: 520px;
            height: var(--app-height, 100dvh);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at top left, rgba(255, 209, 102, 0.42), transparent 34%),
                linear-gradient(180deg, #fffaf0 0%, #fff1d4 100%);
            overflow: hidden;
            position: relative;
        }

        .topbar {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 46px 1fr 86px;
            gap: 8px;
            align-items: center;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
            border-bottom: 3px solid var(--line);
            background: rgba(255, 250, 235, 0.96);
        }

        .icon-btn,
        .action-btn {
            border: 3px solid var(--ink);
            background: var(--panel);
            color: var(--ink);
            font-weight: 900;
            box-shadow: 3px 3px 0 var(--shadow);
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1.5rem;
        }

        .title-box {
            min-width: 0;
            text-align: center;
        }

        .title-box h1 {
            font-size: 1.15rem;
            line-height: 1.1;
        }

        .title-box p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-badge {
            min-height: 42px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background: var(--yellow);
            box-shadow: 3px 3px 0 #d6a944;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .score-badge strong {
            line-height: 1;
            font-size: 1.08rem;
        }

        .score-badge span {
            font-size: 0.66rem;
        }

        .content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
        }

        .round-card,
        .question-card,
        .result-card,
        .score-card {
            border: 3px solid var(--ink);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .round-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 9px 10px;
        }

        .round-text {
            min-width: 0;
            font-size: 0.86rem;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-pill {
            min-width: 64px;
            padding: 7px 8px;
            border-radius: 999px;
            background: #fff1d1;
            border: 2px solid var(--line);
            color: var(--primary-dark);
            text-align: center;
            font-weight: 900;
        }

        .question-card {
            margin-top: 10px;
            padding: 18px 14px;
            text-align: center;
        }

        .question-card .eyebrow {
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: 900;
        }

        .question-card h2 {
            margin-top: 8px;
            font-size: clamp(1.45rem, 7vw, 2rem);
            line-height: 1.18;
            word-break: keep-all;
        }

        .status-text {
            margin-top: 10px;
            min-height: 22px;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 800;
        }

        .vote-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            margin-top: 10px;
        }

        .vote-btn {
            min-height: 108px;
            border: 3px solid var(--ink);
            border-radius: 16px;
            background: var(--panel);
            color: var(--ink);
            box-shadow: 4px 4px 0 var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 7px;
            font-weight: 900;
            position: relative;
        }

        .vote-btn:disabled {
            opacity: 0.86;
        }

        .vote-btn.selected {
            border-color: var(--mint);
            background: #effffb;
            box-shadow: 0 0 0 4px rgba(53, 184, 166, 0.18), 4px 4px 0 var(--shadow);
        }

        .vote-btn.top-target {
            border-color: var(--primary);
            background: #fff0ea;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border: 2px solid var(--ink);
            border-radius: 14px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .vote-name {
            max-width: 100%;
            font-size: 0.96rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vote-count {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .result-card,
        .score-card {
            margin-top: 10px;
            padding: 12px;
        }

        .result-title,
        .score-title {
            font-size: 0.95rem;
            font-weight: 900;
        }

        .result-main {
            margin-top: 8px;
            color: var(--primary-dark);
            font-size: 1.22rem;
            font-weight: 900;
            line-height: 1.25;
        }

        .result-sub {
            margin-top: 5px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 800;
        }

        .vote-list {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        .vote-row,
        .score-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            border-radius: 10px;
            background: #fff8e8;
            padding: 7px 8px;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .score-row.me {
            background: #ecfffb;
        }

        .score-row.winner {
            background: #fff1cf;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            min-height: 44px;
            border-radius: 13px;
            font-size: 0.95rem;
        }

        .action-btn.primary {
            background: var(--mint);
            color: #fff;
            border-color: var(--mint);
        }

        .action-btn.danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(54, 45, 42, 0.42);
            z-index: 20;
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            width: min(100%, 360px);
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.22);
            padding: 18px 14px;
            text-align: center;
        }

        .modal h2 {
            font-size: 1.2rem;
        }

        .modal p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 800;
            line-height: 1.35;
        }

        @media (max-height: 700px) {
            .vote-btn {
                min-height: 92px;
            }

            .question-card {
                padding: 14px 12px;
            }
        }
    </style>
</head>
<body>
    <main id="app">
        <header class="topbar">
            <button id="back-btn" class="icon-btn" type="button" aria-label="나가기">‹</button>
            <div class="title-box">
                <h1>가족순발력퀴즈</h1>
                <p id="room-name">게임방에 입장 중</p>
            </div>
            <div class="score-badge">
                <strong id="my-score">0</strong>
                <span>내 점수</span>
            </div>
        </header>

        <section class="content">
            <div class="round-card">
                <div id="round-text" class="round-text">문제를 준비하고 있습니다.</div>
                <div id="timer-pill" class="timer-pill">--초</div>
            </div>

            <div class="question-card">
                <div class="eyebrow">가족 중 한 명을 빠르게 고르세요</div>
                <h2 id="question-text">잠시만 기다려주세요</h2>
                <div id="status-text" class="status-text"></div>
            </div>

            <div id="vote-grid" class="vote-grid"></div>
            <div id="result-card" class="result-card" style="display:none;"></div>
            <div id="score-card" class="score-card"></div>
        </section>

        <div id="loading-overlay" class="overlay active">
            <div class="modal">
                <h2 id="loading-title">퀴즈 준비중</h2>
                <p id="loading-text">방 정보를 확인하고 있습니다.</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD62xjJrMDgfE4xlb-1Z-3v9bLr9fB2w3g",
            authDomain: "goodluck-7c14b.firebaseapp.com",
            databaseURL: "https://goodluck-7c14b-default-rtdb.firebaseio.com",
            projectId: "goodluck-7c14b",
            storageBucket: "goodluck-7c14b.appspot.com",
            messagingSenderId: "858281658455",
            appId: "1:858281658455:web:9131280a459be983933b12"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const roomsRef = db.ref('rooms');

        const TOTAL_ROUNDS = 8;
        const ROUND_TIME_MS = 15000;
        const QUESTION_BANK = [
            '가장 느려터진 사람은?',
            '가장 밥 조금 먹는 사람은?',
            '가장 겁 많은 사람은?',
            '가장 빨리 삐지는 사람은?',
            '가장 잠 많은 사람은?',
            '가장 웃긴 사람은?',
            '가장 말이 많은 사람은?',
            '가장 말이 없는 사람은?',
            '가장 정리정돈 안 하는 사람은?',
            '가장 길을 잘 잃는 사람은?',
            '가장 잘 웃는 사람은?',
            '가장 빨리 먹는 사람은?',
            '가장 늦게 준비하는 사람은?',
            '가장 사진 찍기 좋아하는 사람은?',
            '가장 간식을 좋아하는 사람은?',
            '가장 게임 욕심 많은 사람은?',
            '가장 눈치 빠른 사람은?',
            '가장 눈치 없는 사람은?',
            '가장 노래를 많이 부르는 사람은?',
            '가장 춤을 잘 출 것 같은 사람은?',
            '가장 아침에 못 일어나는 사람은?',
            '가장 휴대폰을 오래 보는 사람은?',
            '가장 장난이 많은 사람은?',
            '가장 잘 챙겨주는 사람은?',
            '가장 화를 금방 푸는 사람은?',
            '가장 과자를 많이 먹는 사람은?',
            '가장 라면을 좋아하는 사람은?',
            '가장 편식하는 사람은?',
            '가장 잔소리 많이 하는 사람은?',
            '가장 심부름을 잘하는 사람은?',
            '가장 용감한 사람은?',
            '가장 귀여운 척 잘하는 사람은?',
            '가장 약속을 잘 지키는 사람은?',
            '가장 물건을 잘 잃어버리는 사람은?',
            '가장 운이 좋은 사람은?',
            '가장 빨리 웃음 터지는 사람은?',
            '가장 소파를 좋아하는 사람은?',
            '가장 외출 준비가 빠른 사람은?',
            '가장 엄살이 많은 사람은?',
            '가장 칭찬을 좋아하는 사람은?'
        ].map((text, index) => ({ id: `q${index}`, text }));

        const app = document.getElementById('app');
        const backBtn = document.getElementById('back-btn');
        const roomNameEl = document.getElementById('room-name');
        const myScoreEl = document.getElementById('my-score');
        const roundTextEl = document.getElementById('round-text');
        const timerPillEl = document.getElementById('timer-pill');
        const questionTextEl = document.getElementById('question-text');
        const statusTextEl = document.getElementById('status-text');
        const voteGridEl = document.getElementById('vote-grid');
        const resultCardEl = document.getElementById('result-card');
        const scoreCardEl = document.getElementById('score-card');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingTitleEl = document.getElementById('loading-title');
        const loadingTextEl = document.getElementById('loading-text');

        let currentUser = null;
        let myPlayerId = null;
        let myNickname = '';
        let myAvatar = '';
        let roomId = null;
        let roomRef = null;
        let currentRoomData = null;
        let isHost = false;
        let isLeaving = false;
        let playerOnDisconnectRef = null;
        let playerRestorePromise = null;
        let audioContext = null;

        function setScreenHeight() {
            const viewportHeight = Math.floor(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight);
            document.documentElement.style.setProperty('--app-height', `${viewportHeight}px`);
            app.style.height = `${viewportHeight}px`;
        }

        setScreenHeight();
        window.addEventListener('resize', setScreenHeight);
        window.visualViewport?.addEventListener('resize', setScreenHeight);
        window.visualViewport?.addEventListener('scroll', setScreenHeight);

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.replace('index.html');
                return;
            }

            currentUser = user;
            myPlayerId = user.uid;
            myNickname = localStorage.getItem('userNickname') || '플레이어';
            myAvatar = localStorage.getItem('userAvatar') || '🙂';

            const params = new URLSearchParams(window.location.search);
            roomId = params.get('roomId');
            if (!roomId) {
                alert('잘못된 접근입니다.');
                window.location.replace('대기실.html');
                return;
            }

            joinRoom(roomId);
        });

        function joinRoom(id) {
            roomRef = roomsRef.child(id);
            roomRef.once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    alert('방을 찾을 수 없습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                currentRoomData = snapshot.val() || {};
                isHost = currentRoomData.hostId === myPlayerId;
                const hasMyPlayer = Boolean(currentRoomData.players?.[myPlayerId]);
                const canRestorePlayer = currentRoomData.status === 'playing' && currentRoomData.gameType === 'familyQuiz';

                if (!hasMyPlayer && !canRestorePlayer) {
                    alert('방 참가 정보가 없습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                syncMyPlayer().then(() => {
                    listenToRoom();
                }).catch(error => {
                    console.error('가족순발력퀴즈 참가 정보 복구 실패:', error);
                    alert('방 입장에 실패했습니다.');
                    window.location.replace('대기실.html');
                });
            }).catch(error => {
                console.error('가족순발력퀴즈 입장 실패:', error);
                alert('방 입장에 실패했습니다.');
                window.location.replace('대기실.html');
            });
        }

        function getMyPlayerData() {
            return {
                nickname: myNickname,
                avatar: myAvatar,
                isHost
            };
        }

        function syncMyPlayer() {
            if (!roomRef || !myPlayerId) return Promise.resolve();
            if (playerRestorePromise) return playerRestorePromise;

            playerRestorePromise = roomRef.child(`players/${myPlayerId}`).update(getMyPlayerData())
                .then(() => {
                    return protectMyPlayerDuringGame();
                })
                .finally(() => {
                    playerRestorePromise = null;
                });

            return playerRestorePromise;
        }

        function protectMyPlayerDuringGame() {
            cancelPlayerDisconnectHandler();

            try {
                return roomRef.child(`players/${myPlayerId}`).onDisconnect().cancel();
            } catch (error) {
                console.warn('게임 중 자동 퇴장 보호 설정 실패:', error);
                return Promise.resolve();
            }
        }

        function cancelPlayerDisconnectHandler() {
            if (!playerOnDisconnectRef) return;
            try {
                playerOnDisconnectRef.cancel();
            } catch (error) {
                console.warn('접속 종료 예약 취소 실패:', error);
            }
            playerOnDisconnectRef = null;
        }

        function listenToRoom() {
            roomRef.on('value', snapshot => {
                if (isLeaving) return;

                if (!snapshot.exists()) {
                    alert('방이 사라졌습니다.');
                    window.location.replace('대기실.html');
                    return;
                }

                currentRoomData = snapshot.val() || {};
                isHost = currentRoomData.hostId === myPlayerId;

                if (currentRoomData.status !== 'playing') {
                    cancelPlayerDisconnectHandler();
                    window.location.replace(`게임방.html?roomId=${roomId}`);
                    return;
                }

                if (!currentRoomData.players || !currentRoomData.players[myPlayerId]) {
                    showLoading('재접속 중', '참가 정보를 다시 연결하고 있습니다.');
                    syncMyPlayer().catch(error => {
                        console.error('가족순발력퀴즈 참가 정보 재연결 실패:', error);
                        alert('방에서 퇴장되었습니다.');
                        window.location.replace('대기실.html');
                    });
                    return;
                }

                roomNameEl.textContent = currentRoomData.roomName || '가족 방';

                const gameData = currentRoomData.gameData;
                if (!gameData || gameData.gameId !== 'familyQuiz') {
                    if (isHost) {
                        initializeGame();
                    } else {
                        showLoading('퀴즈 준비중', '방장이 문제를 준비하고 있습니다.');
                    }
                    return;
                }

                loadingOverlay.classList.remove('active');
                renderGame(gameData);
                if (isHost) finishVotingIfReady();
            });
        }

        function initializeGame() {
            if (!roomRef || !currentRoomData?.players) return;

            const playerIds = Object.keys(currentRoomData.players).slice(0, 4);
            const question = pickQuestion([]);
            const scores = {};
            playerIds.forEach(id => { scores[id] = 0; });

            roomRef.child('gameData').set({
                gameId: 'familyQuiz',
                phase: 'voting',
                round: 1,
                totalRounds: TOTAL_ROUNDS,
                activePlayers: playerIds,
                questionId: question.id,
                question: question.text,
                usedQuestionIds: [question.id],
                votes: {},
                scores,
                lastResult: null,
                roundStartedAt: Date.now(),
                roundEndsAt: Date.now() + ROUND_TIME_MS,
                createdAt: Date.now()
            });
        }

        function renderGame(gameData) {
            const players = currentRoomData.players || {};
            const activeIds = getActivePlayerIds(gameData, players);
            const myScore = Number(gameData.scores?.[myPlayerId] || 0);
            myScoreEl.textContent = myScore;
            roundTextEl.textContent = gameData.phase === 'final'
                ? '최종 결과'
                : `${Number(gameData.round || 1)} / ${Number(gameData.totalRounds || TOTAL_ROUNDS)} 라운드`;
            questionTextEl.textContent = gameData.phase === 'final' ? '가족 순발력 결과!' : gameData.question || '문제를 준비하고 있습니다.';

            renderTimer(gameData);
            renderVoteOptions(gameData, players, activeIds);
            renderResult(gameData, players, activeIds);
            renderScores(gameData, players, activeIds);
        }

        function renderTimer(gameData) {
            if (gameData.phase !== 'voting') {
                timerPillEl.textContent = gameData.phase === 'final' ? '끝' : '공개';
                return;
            }

            const remaining = Math.max(0, Math.ceil((Number(gameData.roundEndsAt || 0) - Date.now()) / 1000));
            timerPillEl.textContent = `${remaining}초`;
        }

        function renderVoteOptions(gameData, players, activeIds) {
            voteGridEl.innerHTML = '';
            const votes = gameData.votes || {};
            const myVote = votes[myPlayerId]?.targetId || null;
            const result = gameData.lastResult || {};
            const topTargets = result.topTargetIds || [];
            const counts = result.counts || {};

            activeIds.forEach(id => {
                const player = players[id] || {};
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'vote-btn';
                if (myVote === id) button.classList.add('selected');
                if (topTargets.includes(id)) button.classList.add('top-target');
                button.disabled = gameData.phase !== 'voting' || Boolean(myVote);
                button.innerHTML = `
                    <div class="avatar">${getAvatarHTML(player.avatar)}</div>
                    <div class="vote-name">${escapeHTML(player.nickname || '플레이어')}</div>
                    <div class="vote-count">${gameData.phase === 'voting' ? (myVote === id ? '내 선택' : '누르기') : `${counts[id] || 0}표`}</div>
                `;
                button.addEventListener('click', () => submitVote(id));
                voteGridEl.appendChild(button);
            });

            if (gameData.phase === 'voting') {
                const votedCount = Object.keys(votes).filter(id => activeIds.includes(id)).length;
                statusTextEl.textContent = myVote
                    ? `선택 완료: ${players[myVote]?.nickname || '플레이어'}`
                    : `빠르게 고르세요. 현재 ${votedCount}/${activeIds.length}명 선택`;
            } else {
                statusTextEl.textContent = gameData.phase === 'final' ? '최종 점수를 확인하세요.' : '가족들의 선택 결과입니다.';
            }
        }

        function renderResult(gameData, players, activeIds) {
            if (gameData.phase === 'voting') {
                resultCardEl.style.display = 'none';
                resultCardEl.innerHTML = '';
                return;
            }

            resultCardEl.style.display = 'block';

            if (gameData.phase === 'final') {
                const ranking = getRanking(gameData, players, activeIds);
                const winnerNames = ranking.length ? ranking.filter(row => row.score === ranking[0].score).map(row => row.name).join(', ') : '없음';
                resultCardEl.innerHTML = `
                    <div class="result-title">최종 우승</div>
                    <div class="result-main">${escapeHTML(winnerNames)}</div>
                    <div class="result-sub">가족 순발력 퀴즈가 끝났습니다.</div>
                    <div class="actions">
                        ${isHost ? '<button id="restart-btn" class="action-btn primary" type="button">다시하기</button>' : ''}
                        <button id="room-btn" class="action-btn" type="button">게임방</button>
                    </div>
                `;
                document.getElementById('restart-btn')?.addEventListener('click', initializeGame);
                document.getElementById('room-btn')?.addEventListener('click', returnToGameRoom);
                return;
            }

            const result = gameData.lastResult || {};
            const topNames = (result.topTargetIds || []).map(id => players[id]?.nickname || '플레이어');
            const fastestName = result.fastestId ? players[result.fastestId]?.nickname || '플레이어' : '';
            const voteRows = activeIds.map(id => {
                const vote = gameData.votes?.[id];
                const voter = players[id]?.nickname || '플레이어';
                const target = vote?.targetId ? players[vote.targetId]?.nickname || '플레이어' : '미선택';
                return `<div class="vote-row"><span>${escapeHTML(voter)}</span><strong>${escapeHTML(target)}</strong></div>`;
            }).join('');

            resultCardEl.innerHTML = `
                <div class="result-title">이번 라운드 결과</div>
                <div class="result-main">${topNames.length ? `${escapeHTML(topNames.join(', '))} ${result.topCount || 0}표` : '선택된 사람이 없습니다'}</div>
                <div class="result-sub">${fastestName ? `다수 의견 중 가장 빠른 선택: ${escapeHTML(fastestName)}` : '빠른 선택 보너스 없음'}</div>
                <div class="vote-list">${voteRows}</div>
                ${isHost ? `<div class="actions"><button id="next-round-btn" class="action-btn primary" type="button">${Number(gameData.round || 1) >= Number(gameData.totalRounds || TOTAL_ROUNDS) ? '결과 보기' : '다음 문제'}</button></div>` : '<div class="result-sub">방장이 다음 문제로 넘깁니다.</div>'}
            `;
            document.getElementById('next-round-btn')?.addEventListener('click', nextRound);
        }

        function renderScores(gameData, players, activeIds) {
            const ranking = getRanking(gameData, players, activeIds);
            scoreCardEl.innerHTML = `
                <div class="score-title">점수판</div>
                <div class="vote-list">
                    ${ranking.map((row, index) => `
                        <div class="score-row ${row.id === myPlayerId ? 'me' : ''} ${index === 0 ? 'winner' : ''}">
                            <span>${index + 1}. ${escapeHTML(row.name)}</span>
                            <strong>${row.score}점</strong>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function submitVote(targetId) {
            const gameData = currentRoomData?.gameData;
            if (!roomRef || !gameData || gameData.phase !== 'voting') return;
            if (gameData.votes?.[myPlayerId]) return;
            if (!getActivePlayerIds(gameData, currentRoomData.players || {}).includes(targetId)) return;

            playPickSound();
            roomRef.child(`gameData/votes/${myPlayerId}`).set({
                targetId,
                at: Date.now()
            });
        }

        function finishVotingIfReady(force = false) {
            if (!isHost || !roomRef || !currentRoomData?.gameData) return;

            roomRef.transaction(room => {
                if (!room || !room.gameData || room.gameData.gameId !== 'familyQuiz') return;
                const gameData = room.gameData;
                if (gameData.phase !== 'voting') return;

                const activeIds = getActivePlayerIds(gameData, room.players || {});
                const votes = gameData.votes || {};
                const allVoted = activeIds.length > 0 && activeIds.every(id => votes[id]);
                const timeOver = Date.now() >= Number(gameData.roundEndsAt || 0);
                if (!force && !allVoted && !timeOver) return;

                return {
                    ...room,
                    gameData: buildRevealGameData(gameData, activeIds)
                };
            });
        }

        function buildRevealGameData(gameData, activeIds) {
            const votes = gameData.votes || {};
            const counts = {};
            activeIds.forEach(id => { counts[id] = 0; });

            activeIds.forEach(voterId => {
                const targetId = votes[voterId]?.targetId;
                if (activeIds.includes(targetId)) counts[targetId] = Number(counts[targetId] || 0) + 1;
            });

            const topCount = Math.max(0, ...Object.values(counts).map(Number));
            const topTargetIds = topCount > 0 ? activeIds.filter(id => Number(counts[id] || 0) === topCount) : [];
            const scores = { ...(gameData.scores || {}) };
            activeIds.forEach(id => { scores[id] = Number(scores[id] || 0); });

            const majorityVoters = activeIds.filter(voterId => topTargetIds.includes(votes[voterId]?.targetId));
            majorityVoters.forEach(id => { scores[id] += 2; });

            const fastestId = majorityVoters.slice().sort((a, b) => Number(votes[a]?.at || 0) - Number(votes[b]?.at || 0))[0] || null;
            if (fastestId) scores[fastestId] += 1;

            return {
                ...gameData,
                phase: 'reveal',
                scores,
                lastResult: {
                    counts,
                    topTargetIds,
                    topCount,
                    majorityVoters,
                    fastestId,
                    revealedAt: Date.now()
                }
            };
        }

        function nextRound() {
            if (!isHost || !roomRef) return;

            roomRef.transaction(room => {
                if (!room || !room.gameData || room.gameData.gameId !== 'familyQuiz') return;
                const gameData = room.gameData;
                if (gameData.phase !== 'reveal') return;

                const round = Number(gameData.round || 1);
                const totalRounds = Number(gameData.totalRounds || TOTAL_ROUNDS);
                if (round >= totalRounds) {
                    return {
                        ...room,
                        gameData: {
                            ...gameData,
                            phase: 'final',
                            endedAt: Date.now()
                        }
                    };
                }

                const used = Array.isArray(gameData.usedQuestionIds) ? gameData.usedQuestionIds : [];
                const question = pickQuestion(used);
                return {
                    ...room,
                    gameData: {
                        ...gameData,
                        phase: 'voting',
                        round: round + 1,
                        questionId: question.id,
                        question: question.text,
                        usedQuestionIds: used.concat(question.id),
                        votes: {},
                        lastResult: null,
                        roundStartedAt: Date.now(),
                        roundEndsAt: Date.now() + ROUND_TIME_MS
                    }
                };
            });
        }

        function returnToGameRoom() {
            isLeaving = true;
            cancelPlayerDisconnectHandler();

            if (!roomRef) {
                window.location.replace('대기실.html');
                return;
            }

            const done = () => window.location.replace(`게임방.html?roomId=${roomId}`);
            roomRef.update({
                status: 'lobby',
                gameData: null,
                gameStarted: false,
                readyPlayers: null,
                rematchRequests: null
            }).finally(done);
        }

        function getActivePlayerIds(gameData, players) {
            const ids = Array.isArray(gameData.activePlayers) ? gameData.activePlayers : Object.keys(gameData.players || players || {});
            return ids.filter(id => players?.[id]).slice(0, 4);
        }

        function getRanking(gameData, players, activeIds) {
            return activeIds.map(id => ({
                id,
                name: players[id]?.nickname || '플레이어',
                score: Number(gameData.scores?.[id] || 0)
            })).sort((a, b) => {
                if (a.score !== b.score) return b.score - a.score;
                return activeIds.indexOf(a.id) - activeIds.indexOf(b.id);
            });
        }

        function pickQuestion(usedIds) {
            const used = new Set(usedIds || []);
            const pool = QUESTION_BANK.filter(question => !used.has(question.id));
            const source = pool.length ? pool : QUESTION_BANK;
            return source[Math.floor(Math.random() * source.length)];
        }

        function showLoading(title, text) {
            loadingTitleEl.textContent = title;
            loadingTextEl.textContent = text;
            loadingOverlay.classList.add('active');
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function getAvatarHTML(avatar) {
            const value = String(avatar || '🙂');
            if (value.startsWith('http') || value.startsWith('./') || value.startsWith('/') || value.includes('.png') || value.includes('.jpg') || value.includes('.webp')) {
                return `<img src="${escapeHTML(value)}" alt="">`;
            }
            return escapeHTML(value);
        }

        function ensureAudio() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioContext = new AudioContextClass();
            }
            if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
            return audioContext;
        }

        function playTone(frequency, duration = 0.09, type = 'sine', volume = 0.05, delay = 0) {
            const context = ensureAudio();
            if (!context) return;
            const start = context.currentTime + delay;
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            oscillator.connect(gain);
            gain.connect(context.destination);
            oscillator.start(start);
            oscillator.stop(start + duration + 0.03);
        }

        function playPickSound() {
            playTone(540, 0.08, 'triangle', 0.055);
            playTone(780, 0.09, 'triangle', 0.045, 0.05);
        }

        setInterval(() => {
            const gameData = currentRoomData?.gameData;
            if (!gameData || gameData.gameId !== 'familyQuiz') return;
            renderTimer(gameData);
            if (isHost && gameData.phase === 'voting') finishVotingIfReady();
        }, 500);

        backBtn.addEventListener('click', returnToGameRoom);
    </script>
</body>
</html>
